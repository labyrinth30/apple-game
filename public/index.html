<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🍎 사과게임</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background: linear-gradient(180deg, #fef3e2, #fde8d0);
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 12px;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  /* 게임판에서만 드래그 전용(스크롤 방지), 그 밖의 영역은 자연 스크롤 허용 */
  #board { touch-action: none; }
  h1 { font-size: 1.5rem; color: #d63031; margin: 6px 0; }
  .hud { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; justify-content: center; }
  .hud .box {
    background: #fff; border-radius: 12px; padding: 6px 16px;
    box-shadow: 0 2px 6px rgba(0,0,0,.08); text-align: center;
  }
  .hud .label { font-size: .7rem; color: #999; }
  .hud .value { font-size: 1.3rem; font-weight: 700; color: #d63031; }
  button {
    border: none; border-radius: 12px; padding: 10px 18px;
    font-size: .95rem; font-weight: 700; cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,.1); transition: transform .05s;
  }
  button:active { transform: scale(.95); }
  #btnHint { background: #f9ca24; color: #6b4e00; }
  #btnRestart { background: #74b9ff; color: #0a3d62; }
  #board {
    position: relative;
    background: #2d3436;
    border-radius: 14px;
    padding: 6px;
    box-shadow: 0 6px 20px rgba(0,0,0,.25);
  }
  /* ---------- 반응형: viewport 너비 기반 ---------- */
  :root {
    /* 세로 배치(10열 × 17행): 가로는 10칸만 → 모바일에서 칸이 훨씬 큼 */
    --cell: clamp(24px, (100vw - 40px - 28px) / 10, 34px);
    --gap: clamp(1px, 0.4vw, 3px);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(10, var(--cell));
    grid-auto-rows: var(--cell);
    gap: var(--gap);
  }
  .cell {
    width: var(--cell); height: var(--cell); border-radius: 50%;
    background: #ae2e2e; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--cell) * 0.46); font-weight: 800;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.25);
    pointer-events: none;
  }
  .hud .value { font-size: clamp(1.05rem, 4vw, 1.3rem); }
  h1 { font-size: clamp(1.15rem, 5vw, 1.5rem); }
  button { padding: clamp(8px, 2.2vw, 10px) clamp(12px, 3vw, 18px); font-size: clamp(.8rem, 3vw, .95rem); }
  #toast { font-size: clamp(.7rem, 2.6vw, .85rem); }
  .meta { font-size: clamp(.7rem, 2.6vw, .8rem); padding: 0 4px; }
  /* 아주 좁은 화면(갤럭시 폴드 커버 등): 전체 여백 축소 */
  @media (max-width: 400px) {
    body { padding: 6px; }
    #board { padding: 4px; }
  }
  .cell.removed { background: transparent; box-shadow: none; color: transparent; }
  .cell.preview { outline: 2px solid #fff; outline-offset: -2px; }
  .cell.hintCell {
    background: #fdcb6e !important; color: #6b4e00 !important;
    animation: pulse 0.8s infinite alternate;
  }
  /* 빈칸은 힌트 하이라이트를 받지 않는다(제거된 칸이 사과로 '되살아나는' 표시 방지) */
  .cell.removed.hintCell { background: transparent !important; color: transparent !important; animation: none; }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.08); } }
  #selBox {
    position: absolute; border: 3px solid #f9ca24; border-radius: 8px;
    pointer-events: none; display: none;
    background: rgba(249, 202, 36, .12);
  }
  #hintBox {
    position: absolute; border: 3px dashed #55efc4; border-radius: 8px;
    pointer-events: none; display: none;
    background: rgba(85, 239, 196, .1);
    box-shadow: 0 0 12px rgba(85,239,196,.6);
  }
  #toast {
    position: fixed; left: 50%; top: 4px; transform: translateX(-50%);
    background: rgba(45,52,54,.92); color: #fff; padding: 8px 20px;
    border-radius: 20px; font-size: .85rem; font-weight: 600;
    opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 50;
    white-space: nowrap; max-width: 90vw;
  }
  #toast.show { opacity: 1; }
  .meta { margin-top: 10px; color: #8d6e63; font-size: .8rem; }

</style>
</head>
<body>
<h1>🍎 사과게임</h1>
<div class="hud">
  <div class="box"><div class="label">점수</div><div class="value" id="score">0</div></div>
  <div class="box"><div class="label">최고기록</div><div class="value" id="best">0</div></div>
  <button id="btnHint">💡 힌트</button>
  <button id="btnShuffle" style="background:#55efc4;color:#004b3a;">🔀 섞기</button>
  <button id="btnRestart">🔄 다시 시작</button>
</div>
<div id="board">
  <div class="grid" id="grid"></div>
  <div id="selBox"></div>
  <div id="hintBox"></div>
</div>
<div class="meta">드래그해서 사과를 선택하세요 · 합이 10이면 제거!</div>
<div id="toast"></div>

<script type="module">
const ROWS = 17, COLS = 10, TARGET = 10;
const BEST_KEY = 'appleGameBest';

let board = [];
let removed = [];
let score = 0;
let hintTimeout = null;
/* 드래그 상태: 멀티터치/포인터 취소 대비 pointerId 추적 */
let dragging = false, startCell = null, activePointerId = null;

const grid = document.getElementById('grid');
const boardEl = document.getElementById('board');
const selBox = document.getElementById('selBox');
const hintBox = document.getElementById('hintBox');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const toastEl = document.getElementById('toast');

/* localStorage 값 정화: 쓰레기 값/음수 → 0 (NaN 전파 방지) */
function sanitizeBest(v) {
  const n = Number(v);
  return Number.isFinite(n) && n > 0 ? Math.floor(n) : 0;
}
let best = sanitizeBest(localStorage.getItem(BEST_KEY));
bestEl.textContent = best;

/* ---------- 보드 렌더 ---------- */
function buildGrid() {
  grid.innerHTML = '';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.r = r;
      cell.dataset.c = c;
      grid.appendChild(cell);
    }
  }
}

function render() {
  for (const cell of grid.children) {
    const r = +cell.dataset.r, c = +cell.dataset.c;
    cell.textContent = removed[r][c] ? '' : board[r][c];
    cell.classList.toggle('removed', removed[r][c]);
  }
}

/* ---------- 힌트 (브루트포스, 서버 game.ts findHint와 동일 규칙) ----------
 * 규칙: 드래그(직사각형) 안의 "살아있는 사과" 합이 정확히 TARGET,
 *       빈칸(removed=true)은 합/개수에서 완전히 무시, 살아있는 사과 최소 1개.
 * game.ts와 달리 removed 마스크를 인자로 받는다(전역 상태 의존 제거). */
function findHint(bd, mask, target = TARGET) {
  const sum = Array.from({ length: ROWS + 1 }, () => new Array(COLS + 1).fill(0));
  const valid = Array.from({ length: ROWS + 1 }, () => new Array(COLS + 1).fill(0));
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const v = bd[r][c];
      const isVal = !mask[r][c] && typeof v === 'number' && v > 0;
      sum[r + 1][c + 1] = sum[r][c + 1] + sum[r + 1][c] - sum[r][c] + (isVal ? v : 0);
      valid[r + 1][c + 1] = valid[r][c + 1] + valid[r + 1][c] - valid[r][c] + (isVal ? 1 : 0);
    }
  }
  const aSum = (r1, c1, r2, c2) => sum[r2+1][c2+1] - sum[r1][c2+1] - sum[r2+1][c1] + sum[r1][c1];
  const aVal = (r1, c1, r2, c2) => valid[r2+1][c2+1] - valid[r1][c2+1] - valid[r2+1][c1] + valid[r1][c1];
  for (let r1 = 0; r1 < ROWS; r1++)
    for (let c1 = 0; c1 < COLS; c1++)
      for (let r2 = r1; r2 < ROWS; r2++)
        for (let c2 = c1; c2 < COLS; c2++) {
          // aVal > 0: 영역 안에 살아있는 사과가 최소 1개 이상 존재해야 함
          if (aVal(r1, c1, r2, c2) === 0) continue;
          if (aSum(r1, c1, r2, c2) === target)
            return { r1, c1, r2, c2 };
        }
  return null;
}

function showHint() {
  clearHint();
  const rect = findHint(board, removed);
  if (!rect) {
    showToast('🧩 풀 수 있는 조합이 없어요 — 🔄 섞기 버튼을 눌러주세요!');
    const sh = document.getElementById('btnShuffle');
    if (sh) { sh.style.animation = 'pulse .5s 4'; setTimeout(() => sh.style.animation = '', 2100); }
    return;
  }
  // 시각적 표시만: 제거/점수 변경 없음. 빈칸은 하이라이트하지 않는다(되살아난 것처럼 보이는 버그 방지).
  for (let r = rect.r1; r <= rect.r2; r++)
    for (let c = rect.c1; c <= rect.c2; c++)
      if (!removed[r][c]) grid.children[r * COLS + c].classList.add('hintCell');
  const { x, y, w, h } = rectPx(rect);
  Object.assign(hintBox.style, { display: 'block', left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
  hintTimeout = setTimeout(clearHint, 4000); // 4초 후 만료
}

function clearHint() {
  if (hintTimeout) { clearTimeout(hintTimeout); hintTimeout = null; }
  hintBox.style.display = 'none';
  for (const cell of grid.children) cell.classList.remove('hintCell');
}

/* ---------- 드래그 선택 ---------- */
function cellFromPoint(x, y) {
  const rect = grid.getBoundingClientRect();
  const style = getComputedStyle(grid);
  const gap = parseFloat(style.gap) || 0;
  // 정확한 칸 크기: (그리드 내부폭 - (n-1)*gap) / n  (offsetWidth 반올림 오차 누적 방지)
  const cw = (rect.width - (COLS - 1) * gap) / COLS;
  const ch = (rect.height - (ROWS - 1) * gap) / ROWS;
  const c = Math.floor((x - rect.left) / (cw + gap));
  const r = Math.floor((y - rect.top) / (ch + gap));
  if (r < 0 || c < 0 || r >= ROWS || c >= COLS) return null;
  return { r, c };
}

function rectPx({ r1, c1, r2, c2 }) {
  const a = grid.children[r1 * COLS + c1];
  const b = grid.children[r2 * COLS + c2];
  const ga = a.getBoundingClientRect(), gb = b.getBoundingClientRect();
  const ba = boardEl.getBoundingClientRect();
  return {
    // 박스 테두리(3px) 안쪽 면이 칸 경계에 맞도록 3px 마진
    x: Math.min(ga.left, gb.left) - ba.left - 3,
    y: Math.min(ga.top, gb.top) - ba.top - 3,
    w: Math.max(ga.right, gb.right) - Math.min(ga.left, gb.left) + 6,
    h: Math.max(ga.bottom, gb.bottom) - Math.min(ga.top, gb.top) + 6
  };
}

function previewRect(sc, ec) {
  const r1 = Math.min(sc.r, ec.r), r2 = Math.max(sc.r, ec.r);
  const c1 = Math.min(sc.c, ec.c), c2 = Math.max(sc.c, ec.c);
  let s = 0, aliveCount = 0;
  for (let r = r1; r <= r2; r++)
    for (let c = c1; c <= c2; c++) {
      if (!removed[r][c]) { s += board[r][c]; aliveCount++; }
    }
  // 규칙: 남아있는(삭제되지 않은) 사과 합이 정확히 10이면 제거.
  // 빈칸(이미 제거된 칸)은 드래그 범위 안에 있어도 합에 포함되지 않음.
  // 단, 최소 1개 이상의 사과가 필요함: 빈 영역만 드래그하는 것은 무효.
  const ok = aliveCount > 0 && s === TARGET;
  for (const cell of grid.children) cell.classList.remove('preview');
  const { x, y, w, h } = rectPx({ r1, c1, r2, c2 });
  selBox.style.display = 'block';
  selBox.style.left = x + 'px'; selBox.style.top = y + 'px';
  selBox.style.width = w + 'px'; selBox.style.height = h + 'px';
  selBox.style.borderColor = ok ? '#55efc4' : '#f9ca24';
  selBox.style.background = ok ? 'rgba(85,239,196,.15)' : 'rgba(249,202,36,.12)';
  if (ok)
    for (let r = r1; r <= r2; r++)
      for (let c = c1; c <= c2; c++)
        if (!removed[r][c]) grid.children[r * COLS + c].classList.add('preview'); // 빈칸에는 preview 표시 안 함
  return { r1, c1, r2, c2, ok };
}

/* 드래그 시각 상태 완전 해제 (preview/selBox) — 취소 경로에서도 누수 없도록 공용화 */
function clearDragVisuals() {
  selBox.style.display = 'none';
  for (const cell of grid.children) cell.classList.remove('preview');
}

function cancelDrag() {
  dragging = false;
  startCell = null;
  activePointerId = null;
  clearDragVisuals();
}

function pointerDown(e) {
  if (e.button !== undefined && e.button !== 0) return;
  if (dragging) return; // 멀티터치: 이미 진행 중인 드래그가 있으면 새 포인터 무시
  const cell = cellFromPoint(e.clientX, e.clientY);
  if (!cell) return;
  clearHint(); // 드래그 시작 시 힌트 표시 해제 (힌트 상태 누수 방지)
  dragging = true;
  activePointerId = e.pointerId;
  startCell = cell;
  previewRect(startCell, cell);
  e.preventDefault();
}

function pointerMove(e) {
  if (!dragging || e.pointerId !== activePointerId) return;
  const cell = cellFromPoint(e.clientX, e.clientY);
  if (cell) previewRect(startCell, cell);
  e.preventDefault();
}

function pointerUp(e) {
  if (!dragging || e.pointerId !== activePointerId) return;
  dragging = false;
  activePointerId = null;
  const cell = cellFromPoint(e.clientX, e.clientY) ?? startCell;
  const sel = previewRect(startCell, cell);
  clearDragVisuals();
  if (sel.ok) {
    let count = 0;
    for (let r = sel.r1; r <= sel.r2; r++)
      for (let c = sel.c1; c <= sel.c2; c++) {
        // 점수는 "실제로 제거한 사과 수"만 누적 — 이미 빈칸인 칸은 재계수 금지 (점수 인플레이션 버그 수정)
        if (!removed[r][c]) { removed[r][c] = true; count++; }
      }
    render(); // 즉시 사과 제거 반영
    score += count;
    scoreEl.textContent = score;
    if (score > best) {
      best = score;
      localStorage.setItem(BEST_KEY, String(best));
      bestEl.textContent = best;
    }
    // 제거로 인해 남은 사과가 10 미만이면 조합 불가능 → 새 보드 제안은 하지 않음 (MVP 규칙)
  }
  startCell = null;
  e.preventDefault();
}

/* ---------- 토스트 ---------- */
let toastTimer = null;
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2000);
}

/* ---------- 섞기 (무제한) ---------- */
function shuffle() {
  // 제거되지 않은 칸의 값들만 수집해 랜덤 재배치. removed(빈칸) 절대 리셋 금지 —
  // 리셋하면 사라진 사과가 다시 나타나는 치명적 버그가 됨.
  const alive = [];
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (!removed[r][c]) alive.push(board[r][c]);
  // Fisher-Yates
  for (let i = alive.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [alive[i], alive[j]] = [alive[j], alive[i]];
  }
  let idx = 0;
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (!removed[r][c]) board[r][c] = alive[idx++];
  cancelDrag();   // 진행 중 드래그/preview 상태 정리 (보드가 바뀌었으므로 무효)
  clearHint();
  render();
}

/* ---------- 다시 시작 ---------- */
function newBoard() {
  board = [];
  removed = [];
  for (let r = 0; r < ROWS; r++) {
    board.push(Array.from({ length: COLS }, () => 1 + Math.floor(Math.random() * 9)));
    removed.push(new Array(COLS).fill(false));
  }
  score = 0;
  scoreEl.textContent = '0';
  cancelDrag();   // removed/score/preview/드래그 상태 완전 초기화
  clearHint();
  render();
}

/* ---------- 이벤트 바인딩 ---------- */
boardEl.addEventListener('pointerdown', pointerDown);
window.addEventListener('pointermove', pointerMove);
window.addEventListener('pointerup', pointerUp);
window.addEventListener('pointercancel', (e) => {
  // 터치 취소/스크롤 뺏김 등: 제거 없이 시각 상태만 정리 (preview 누수 방지)
  if (!dragging || e.pointerId !== activePointerId) return;
  cancelDrag();
});
window.addEventListener('blur', cancelDrag);
document.getElementById('btnHint').addEventListener('click', showHint);
document.getElementById('btnShuffle').addEventListener('click', () => {
  shuffle();
  showToast('🔀 남은 사과를 섞었어요!');
});
document.getElementById('btnRestart').addEventListener('click', () => {
  newBoard();
  showToast('새 보드로 다시 시작! 점수 0');
});

buildGrid();
newBoard();
</script>
</body>
</html>
